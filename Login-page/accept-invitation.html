<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d2b2b">
    <title>Accept invitation | TPC Student Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <script type="module" src="accept-invitation.js" defer></script>
</head>

<body>
    <main class="auth-shell">
        <section class="brand-panel" aria-label="TPC Student Register">
            <div class="brand-mark"><img src="../Imgages/AndUsLoginLogo.png.png" alt="TPC logo"></div>
            <p class="eyebrow">Training and Placement Cell</p>
            <h1>Your access is ready.</h1>
            <p class="brand-copy">Accept your approved role and create a password to access the student register.</p>
            <div class="brand-line"></div>
            <p class="brand-note">TPC student register management</p>
        </section>
        <section class="form-panel">
            <div class="form-wrap">
                <p class="eyebrow">Invitation</p>
                <h2>Create your password</h2>
                <p class="form-subtitle">Choose a password of at least 8 characters to activate your account.</p>
                <form id="invitation-form">
                    <div class="field">
                        <label for="password">Password</label>
                        <div class="password-wrap">
                            <input id="password" type="password" autocomplete="new-password" minlength="8" required>
                            <button class="password-toggle" type="button" data-target="password"
                                aria-label="Show password">Show</button>
                        </div>
                    </div>
                    <div class="field">
                        <label for="confirm-password">Confirm password</label>
                        <div class="password-wrap">
                            <input id="confirm-password" type="password" autocomplete="new-password" minlength="8"
                                required>
                            <button class="password-toggle" type="button" data-target="confirm-password"
                                aria-label="Show password">Show</button>
                        </div>
                    </div>
                    <button class="submit-button" id="invitation-submit" type="submit">Approve and create account
                        <span aria-hidden="true">&#8594;</span></button>
                    <p class="status" id="invitation-status" role="alert" aria-live="polite"></p>
                </form>
            </div>
        </section>
    </main>
</body>

</html>
